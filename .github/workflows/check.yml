name: Workshop setup

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm --prefix agent run init-setup
      - run: npm --prefix agent test
      - run: npm --prefix agent run typecheck -- --noUnusedLocals --noUnusedParameters
      - run: npm --prefix agent run build
      - run: git diff --exit-code -- agent/package.json agent/package-lock.json
